
workflows:
  kamui-build:
    name: KAMUI IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        BID: "com.kamui.escape"

    scripts:
      - name: Check environment
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version

      - name: Build KAMUI IPA
        script: |
          chmod +x ./build.sh
          ./build.sh

    artifacts:
      - build/*.ipa
